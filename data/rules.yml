# data/rules.yml
version: "3.1"

rules:
- rule: Respond to greetings
  steps:
  - intent: greet
  - action: utter_greet

- rule: Respond to goodbyes
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Handle knowledge base questions
  steps:
  - intent: ask_knowledge_base
  - action: action_query_knowledge_base